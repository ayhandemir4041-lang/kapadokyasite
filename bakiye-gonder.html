<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bakiye Gönder - Kapadokya Network</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700&family=Inter:wght@400;500;600&display=swap');

  :root{
    --bg: #f0e4c8;
    --panel: #f7efd9;
    --panel-border: #e2d3ab;
    --accent: #d97b2e;
    --accent-dim: #fbe9d3;
    --text: #3a2e1e;
    --text-dim: #8a7a5c;
    --input-bg: #fffbf1;
  }

  *{ box-sizing: border-box; }

  body{
    margin:0;
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', sans-serif;
    display:flex;
    justify-content:center;
    min-height:100vh;
  }

  .phone{
    width:100%;
    max-width:430px;
    min-height:100vh;
    background: var(--bg);
    position:relative;
  }

  .topbar{
    display:flex;
    align-items:center;
    gap:18px;
    padding:20px 20px;
    background: var(--panel);
    border-bottom:1px solid var(--panel-border);
  }
  .topbar .logo{
    width:60px; height:60px;
    border-radius:50%;
    flex-shrink:0;
  }
  .topbar .title{
    font-family:'Baloo 2', sans-serif;
    font-size:24px;
    font-weight:700;
    color: var(--text);
    flex:1;
  }
  .topbar .menu{
    display:flex;
    flex-direction:column;
    gap:6px;
    flex-shrink:0;
  }
  .topbar .menu span{
    width:30px; height:3px;
    background: var(--text);
    border-radius:2px;
    display:block;
  }

  .crumbs{
    margin:18px 20px 0;
    background: var(--panel);
    border:1px solid var(--panel-border);
    border-radius:14px;
    padding:14px 18px;
    display:flex;
    align-items:center;
    gap:10px;
    font-size:14px;
    color:var(--text-dim);
  }
  .crumbs .sep{ opacity:.5; }
  .crumbs .current{ color: var(--text); }

  h1.page-title{
    font-family:'Baloo 2', sans-serif;
    font-size:30px;
    font-weight:700;
    margin:26px 20px 18px;
  }

  .card{
    margin:0 20px;
    background: var(--panel);
    border:1px solid var(--panel-border);
    border-radius:18px;
    padding:26px 22px 24px;
  }

  label{
    display:block;
    font-size:14px;
    color:var(--text-dim);
    margin-bottom:10px;
  }

  input[type="text"]{
    width:100%;
    background: var(--input-bg);
    border:1px solid var(--panel-border);
    border-radius:12px;
    padding:16px 16px;
    color: var(--text);
    font-size:16px;
    font-family:'Inter', sans-serif;
    outline:none;
    margin-bottom:22px;
  }
  input[type="text"]:last-of-type{ margin-bottom:0; }
  input[type="text"]::placeholder{ color:#a89b7d; }
  input[type="text"]:focus{
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(217,123,46,.15);
  }

  .divider{
    height:1px;
    background: var(--panel-border);
    margin:24px 0 20px;
  }

  .submit{
    width:100%;
    background: var(--accent);
    color:#fffbf1;
    border:none;
    border-radius:14px;
    padding:17px;
    font-family:'Baloo 2', sans-serif;
    font-size:17px;
    font-weight:700;
    cursor:pointer;
  }
  .submit:active{ transform: scale(0.98); }

  .footer{
    text-align:center;
    color:var(--text-dim);
    font-size:12px;
    padding:26px 20px 30px;
  }
</style>
</head>
<body>
  <div class="phone">
    <div class="topbar">
      <img class="logo" src="https://kapadokyanetwork.xyz/logo.png" alt="Kapadokya Network logosu">
      <div class="title">Kapadokya Network</div>
      <div class="menu"><span></span><span></span><span></span></div>
    </div>

    <div class="crumbs">
      <span>⌂</span>
      <span class="sep">›</span>
      <span>Profil</span>
      <span class="sep">›</span>
      <span class="current">Bakiye Gönder</span>
    </div>

    <h1 class="page-title">Bakiye Gönder</h1>

    <div class="card">
      <label for="username">Kullanıcı Adı</label>
      <input type="text" id="username" placeholder="Kullanıcı adı girin.">

      <label for="amount">Miktar</label>
      <input type="text" id="amount" placeholder="Miktarı girin.">

      <div class="divider"></div>

      <button class="submit">Bakiye Gönder</button>
    </div>

    <div class="footer">kapadokyanetwork.xyz · Bedrock SkyBlock</div>
  </div>
</body>
</html>
