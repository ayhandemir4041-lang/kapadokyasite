<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bakiye Yükle - Kapadokya Network</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700&family=Inter:wght@400;500;600&display=swap');

  :root{
    --bg: #f0e4c8;
    --panel: #f7efd9;
    --panel-border: #e2d3ab;
    --accent: #d97b2e;
    --accent-dim: #fbe9d3;
    --text: #3a2e1e;
    --text-dim: #8a7a5c;
    --input-bg: #fffbf1;
  }

  *{ box-sizing: border-box; }

  body{
    margin:0;
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', sans-serif;
    display:flex;
    justify-content:center;
    min-height:100vh;
  }

  .phone{
    width:100%;
    max-width:430px;
    min-height:100vh;
    background: var(--bg);
    position:relative;
  }

  .topbar{
    display:flex;
    align-items:center;
    gap:18px;
    padding:20px 20px;
    background: var(--panel);
    border-bottom:1px solid var(--panel-border);
  }
  .topbar .logo{
    width:60px; height:60px;
    border-radius:50%;
    flex-shrink:0;
  }
  .topbar .title{
    font-family:'Baloo 2', sans-serif;
    font-size:24px;
    font-weight:700;
    color: var(--text);
    flex:1;
  }
  .topbar .menu{
    display:flex;
    flex-direction:column;
    gap:6px;
    flex-shrink:0;
  }
  .topbar .menu span{
    width:30px; height:3px;
    background: var(--text);
    border-radius:2px;
    display:block;
  }

  .crumbs{
    margin:18px 20px 0;
    background: var(--panel);
    border:1px solid var(--panel-border);
    border-radius:14px;
    padding:14px 18px;
    display:flex;
    align-items:center;
    gap:10px;
    font-size:14px;
    color:var(--text-dim);
  }
  .crumbs .sep{ opacity:.5; }
  .crumbs .current{ color: var(--text); }

  h1.page-title{
    font-family:'Baloo 2', sans-serif;
    font-size:30px;
    font-weight:700;
    margin:26px 20px 18px;
  }

  .card{
    margin:0 20px;
    background: var(--panel);
    border:1px solid var(--panel-border);
    border-radius:18px;
    padding:26px 22px 24px;
  }

  label{
    display:block;
    font-size:14px;
    color:var(--text-dim);
    margin-bottom:10px;
  }

  input[type="text"]{
    width:100%;
    background: var(--input-bg);
    border:1px solid var(--panel-border);
    border-radius:12px;
    padding:16px 16px;
    color: var(--text);
    font-size:16px;
    font-family:'Inter', sans-serif;
    outline:none;
  }
  input[type="text"]::placeholder{ color:#5f6154; }
  input[type="text"]:focus{
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(127,216,88,.15);
  }

  .limit-note{
    font-size:12.5px;
    color: var(--text-dim);
    margin-top:9px;
    display:flex;
    align-items:center;
    gap:6px;
  }
  .limit-note .dot{
    width:5px; height:5px;
    border-radius:50%;
    background: var(--accent);
    flex-shrink:0;
  }

  .section-label{
    font-size:14px;
    color: var(--text-dim);
    margin: 26px 0 12px;
  }

  .method{
    border:2px solid var(--accent);
    background: var(--accent-dim);
    border-radius:14px;
    padding:20px 18px;
    display:flex;
    align-items:center;
    justify-content:space-between;
  }
  .method-name{
    font-size:16px;
    font-weight:600;
    line-height:1.3;
  }
  .method-check{
    width:22px; height:22px;
    border-radius:50%;
    background: var(--accent);
    display:flex; align-items:center; justify-content:center;
    flex-shrink:0;
    margin-left:12px;
  }
  .method-check svg{ width:12px; height:12px; }

  .terms{
    display:flex;
    align-items:flex-start;
    gap:12px;
    margin-top:24px;
    font-size:13.5px;
    color:var(--text-dim);
  }
  .terms input{
    width:20px; height:20px;
    accent-color: var(--accent);
    margin-top:1px;
    flex-shrink:0;
  }
  .terms a{ color: var(--text); text-decoration:underline; }

  .submit{
    width:100%;
    margin-top:26px;
    background: var(--accent);
    color:#fffbf1;
    border:none;
    border-radius:14px;
    padding:17px;
    font-family:'Baloo 2', sans-serif;
    font-size:17px;
    font-weight:700;
    cursor:pointer;
  }
  .submit:active{ transform: scale(0.98); }

  .footer{
    text-align:center;
    color:var(--text-dim);
    font-size:12px;
    padding:26px 20px 30px;
  }
</style>
</head>
<body>
  <div class="phone">
    <div class="topbar">
      <img class="logo" src="https://kapadokyanetwork.xyz/logo.png" alt="Kapadokya Network logosu">
      <div class="title">Kapadokya Network</div>
      <div class="menu"><span></span><span></span><span></span></div>
    </div>

    <div class="crumbs">
      <span>⌂</span>
      <span class="sep">›</span>
      <span>Profil</span>
      <span class="sep">›</span>
      <span class="current">Bakiye Yükle</span>
    </div>

    <h1 class="page-title">Bakiye Yükle</h1>

    <div class="card">
      <label for="amount">Miktar</label>
      <input type="text" id="amount" placeholder="Miktarı girin.">
      <div class="limit-note"><span class="dot"></span> Yükleme alt sınırı 20₺'dir.</div>
      <div class="limit-note"><span class="dot"></span> Mağaza kısmındaki hazır bakiye paketlerinden de alabilirsiniz.</div>

      <div class="section-label">Ödeme Yöntemi</div>
      <div class="method">
        <div class="method-name">Shopier – Kredi &amp; Banka Kartı</div>
        <div class="method-check">
          <svg viewBox="0 0 24 24" fill="none"><path d="M5 13l4 4L19 7" stroke="#fffbf1" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </div>
      </div>

      <label class="terms">
        <input type="checkbox">
        <span>Kullanım Şartlarını kabul ediyorum.</span>
      </label>

      <button class="submit">Bakiye Yükle</button>
    </div>

    <div class="footer">kapadokyanetwork.xyz · Bedrock SkyBlock</div>
  </div>
</body>
</html>
